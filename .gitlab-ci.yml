stages:
    - dev
    - production
Deploy to Dev:
  stage: dev
  tags:
    - node
  script:
    - bash ./.gitlab-deploy.sh -d
  only:
    refs:
      - dev

Deploy to Production:
  stage: production
  tags:
    - node-2
  script:
    - bash ./.gitlab-deploy.sh -m
  only:
    refs:
      - master

Deploy Master to Dev:
  stage: dev
  tags:
    - node
  script:
    - bash ./.gitlab-deploy.sh -dm
  only:
    refs:
      - master